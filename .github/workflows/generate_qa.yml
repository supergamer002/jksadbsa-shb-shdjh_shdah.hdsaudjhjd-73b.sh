name: Generazione Q&A

on:
  workflow_dispatch:

  schedule:
    # Feriali — sessione notturna: 04:00 Italia (CEST, UTC+2) = 02:00 UTC
    - cron: '0 2 * * 1-5'

    # Feriali — sessione mattutina: 09:10 Italia (CEST, UTC+2) = 07:10 UTC
    - cron: '10 7 * * 1-5'

    # Weekend — sessione unica: 08:00 Italia (CEST, UTC+2) = 06:00 UTC
    - cron: '0 6 * * 0,6'

permissions:
  contents: write
  issues: write

concurrency:
  group: generate-qa
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip || true
          pip install -r requirements.txt || true

      - name: Decritta progetto
        id: decrypt
        continue-on-error: true
        env:
          PROJECT_AES_KEY: ${{ secrets.PROJECT_AES_KEY }}
        run: |
          python bootstrap.py decrypt

      - name: Controlla dataset
        continue-on-error: true
        run: |
          echo "========================================"
          echo "CONTROLLO DATASET"
          echo "========================================"

          if [ ! -d "segmenti" ]; then
            echo "ATTENZIONE: cartella segmenti/ non trovata."
            exit 0
          fi

          echo "Dataset trovato."
          echo
          echo "Numero file JSON:"
          find segmenti -type f -name "*.json" | wc -l

          echo
          echo "Prime 20 unità:"
          find segmenti -type f -name "*.json" | head -20

      - name: Genera Q&A
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          G1THUB_TOKEN: ${{ secrets.G1THUB_TOKEN }}
        run: |
          echo "========================================"
          echo "GENERAZIONE Q&A"
          echo "========================================"
          echo "Nessun timeout interno."
          echo "Il programma salva progressivamente checkpoint e risultati."
          echo "Eventuali errori non bloccanti vengono gestiti da generate_qa.py."
          echo "========================================"

          set +e

          python generate_qa.py             --input segmenti/ingegneria/chimica/*/*.json             --output-dir dataset_generation/out             --esempi-per-unita 3             --provider api             --blocco-unita 6

          EXIT_CODE=$?

          echo
          echo "generate_qa.py terminato con codice: $EXIT_CODE"
          echo "Il workflow continua comunque verso salvataggio e commit."
          exit 0

      - name: Controlla risultati
        if: always()
        continue-on-error: true
        run: |
          echo
          echo "========================================"
          echo "RISULTATI"
          echo "========================================"

          if [ -f "dataset_generation/out/state.db" ]; then
            echo "state.db: OK"
            ls -lh dataset_generation/out/state.db
          else
            echo "ATTENZIONE: state.db non trovato"
          fi

          if [ -f "dataset_generation/out/qa_raw.jsonl" ]; then
            echo "qa_raw.jsonl: OK"
            ls -lh dataset_generation/out/qa_raw.jsonl
            echo
            echo "Numero Q&A:"
            wc -l dataset_generation/out/qa_raw.jsonl
          else
            echo "ATTENZIONE: qa_raw.jsonl non trovato"
          fi

      - name: Controlla completamento dataset
        id: completion
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import sqlite3
          from pathlib import Path

          DB = Path("dataset_generation/out/state.db")
          ROOT = Path("segmenti/ingegneria/chimica")
          ESEMPI_PER_UNITA = 3

          if not DB.exists() or not ROOT.exists():
              print("Dataset/checkpoint non disponibile: nessun blocco del workflow.")
              Path("/tmp/dataset_completed").write_text("false")
              raise SystemExit(0)

          try:
              spec = importlib.util.spec_from_file_location("generate_qa", "generate_qa.py")
              generate_qa = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(generate_qa)

              conn = sqlite3.connect(DB)
              totale_attese = 0
              totale_completate = 0
              mancanti = []

              for path in sorted(ROOT.glob("*/*.json")):
                  try:
                      with open(path, encoding="utf-8") as f:
                          unita_list = json.load(f)
                  except Exception as e:
                      print(f"ATTENZIONE: impossibile leggere {path}: {e}")
                      continue

                  for indice, unita in enumerate(unita_list):
                      if not unita.get("idoneo_finetuning", False):
                          continue

                      try:
                          varianti = generate_qa.pianifica_varianti(indice, ESEMPI_PER_UNITA)
                      except Exception as e:
                          print(f"ATTENZIONE: pianificazione fallita per {path}, unità {indice}: {e}")
                          continue

                      for variante in varianti:
                          totale_attese += 1
                          try:
                              hash_variante = generate_qa.variante_hash(
                                  unita,
                                  variante["variante_idx"],
                                  variante["formato"],
                                  variante["tipo_domanda"],
                              )
                              row = conn.execute(
                                  "SELECT stato FROM unita_processate WHERE hash = ?",
                                  (hash_variante,),
                              ).fetchone()

                              if row and row[0] == "ok":
                                  totale_completate += 1
                              else:
                                  mancanti.append(
                                      (path, indice, variante["variante_idx"],
                                       variante["formato"], variante["tipo_domanda"])
                                  )
                          except Exception as e:
                              print(f"ATTENZIONE: controllo variante fallito: {e}")
                              mancanti.append((path, indice, variante.get("variante_idx"), "", ""))

              conn.close()

              print()
              print("========================================")
              print("CONTROLLO COMPLETAMENTO")
              print("========================================")
              print(f"Varianti attese:      {totale_attese}")
              print(f"Varianti completate:  {totale_completate}")
              print(f"Varianti mancanti:    {len(mancanti)}")

              if totale_attese > 0 and not mancanti:
                  print("DATASET COMPLETATO")
                  Path("/tmp/dataset_completed").write_text("true")
              else:
                  print("Dataset ancora in lavorazione.")
                  Path("/tmp/dataset_completed").write_text("false")

          except Exception as e:
              print(f"ATTENZIONE: controllo completamento fallito: {type(e).__name__}: {e}")
              Path("/tmp/dataset_completed").write_text("false")
          PY

          echo "completed=$(cat /tmp/dataset_completed 2>/dev/null || echo false)" >> "$GITHUB_OUTPUT"

      - name: Notifica completamento
        if: always() && steps.completion.outputs.completed == 'true' && !hashFiles('.dataset_completed')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create             --title "🎉 Dataset Q&A completato"             --body "Tutte le varianti previste per le unità idonee al fine-tuning sono state elaborate. Il dataset Q&A è completo."             --assignee @me || true

          touch .dataset_completed

      - name: Ricifra progetto
        if: always() && steps.decrypt.outcome == 'success'
        continue-on-error: true
        env:
          PROJECT_AES_KEY: ${{ secrets.PROJECT_AES_KEY }}
        run: |
          python bootstrap.py encrypt || {
            echo "ATTENZIONE: ricifratura fallita."
            echo "I risultati presenti nel workspace verranno comunque tentati nel commit."
            exit 0
          }

      - name: Commit e push — MEGA SAFE
        if: always()
        continue-on-error: true
        run: |
          set +e

          echo "========================================"
          echo "SALVATAGGIO DEFINITIVO"
          echo "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Aggiorna prima il riferimento remoto. Non usare rebase sul commit
          # appena creato: un conflitto di rebase non deve impedire il salvataggio.
          git fetch origin main
          FETCH_CODE=$?

          if [ "$FETCH_CODE" -ne 0 ]; then
            echo "ATTENZIONE: git fetch fallito ($FETCH_CODE). Provo comunque il commit locale."
          fi

          git add -A
          ADD_CODE=$?

          if [ "$ADD_CODE" -ne 0 ]; then
            echo "ATTENZIONE: git add ha restituito $ADD_CODE."
          fi

          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
            exit 0
          fi

          git commit -m "Update dataset"
          COMMIT_CODE=$?

          if [ "$COMMIT_CODE" -ne 0 ]; then
            echo "ATTENZIONE: commit fallito ($COMMIT_CODE)."
            git status --short
            exit 0
          fi

          echo "Commit locale creato."
          git log -1 --oneline

          # Primo tentativo diretto.
          git push origin HEAD:main
          PUSH_CODE=$?

          if [ "$PUSH_CODE" -eq 0 ]; then
            echo "✅ Push riuscito."
            exit 0
          fi

          echo "Push rifiutato. Provo a integrare il main remoto senza perdere il commit locale."

          # Fino a 5 tentativi. In caso di conflitto, il commit locale resta
          # quello da preservare: i conflitti vengono risolti a favore di HEAD.
          for ATTEMPT in 1 2 3 4 5; do
            echo
            echo "=== Tentativo integrazione/push $ATTEMPT/5 ==="

            git fetch origin main
            if [ "$?" -ne 0 ]; then
              echo "fetch fallito."
              sleep 5
              continue
            fi

            git merge --no-edit -X ours origin/main
            MERGE_CODE=$?

            if [ "$MERGE_CODE" -ne 0 ]; then
              echo "Merge fallito ($MERGE_CODE)."
              git merge --abort 2>/dev/null
              sleep 5
              continue
            fi

            git push origin HEAD:main
            PUSH_CODE=$?

            if [ "$PUSH_CODE" -eq 0 ]; then
              echo "✅ Push riuscito al tentativo $ATTEMPT."
              exit 0
            fi

            sleep 5
          done

          echo
          echo "⚠️ Push non riuscito dopo tutti i tentativi."
          echo "Il commit locale è stato comunque creato:"
          git log -1 --oneline
          echo "Il workflow NON viene marcato come fallito."
          exit 0
